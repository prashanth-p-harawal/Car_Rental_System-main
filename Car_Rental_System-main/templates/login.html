{% extends 'base.html' %}

{% block title %}Admin Login{% endblock %}

{% block content %}

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-5">

<div class="card shadow-lg border-0">

<div class="card-body p-5">

<h2 class="text-center mb-4">

Admin Login

</h2>

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Username</label>

<input type="text"
class="form-control"
name="username"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input type="password"
class="form-control"
name="password"
required>

</div>

<div class="d-grid">

<button class="btn btn-warning btn-lg">

Login

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
